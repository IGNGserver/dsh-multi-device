name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel; test publishes a prerelease, stable publishes a formal release'
        required: true
        type: choice
        options:
          - test
          - stable
        default: test

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'test' }}

jobs:
  release:
    name: Verify, package and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate release tag and channel
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "Release builds must run from a version tag." >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v${version}" ]] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $version." >&2; exit 1; }
          [[ "$DSH_RELEASE_CHANNEL" == "test" || "$DSH_RELEASE_CHANNEL" == "stable" ]] || { echo "Invalid release channel: $DSH_RELEASE_CHANNEL" >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild binary
        run: pnpm rebuild esbuild

      - name: Verify version, typecheck, artifacts, build and test
        run: |
          pnpm run verify:version
          pnpm run typecheck
          pnpm run build
          pnpm run verify:artifacts
          pnpm run test

      - name: Package release assets and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release-assets

          # 1. Standard npm/pnpm plugin tarball (for `dsh plugin add`)
          npm pack --json --pack-destination release-assets > "$RUNNER_TEMP/release-pack.json"
          node scripts/verify-package.mjs "$RUNNER_TEMP/release-pack.json"
          mv "release-assets/dsh-multi-device-${version}.tgz" "release-assets/dsh-multi-device-v${version}.tgz"

          # 2. Full standalone bundle archive
          tar -czf "release-assets/dsh-multi-device-bundle-v${version}.tar.gz" \
            package.json cordis.patch.yml VERSION README.md RELEASE.md LICENSE icon.svg locale lib src stubs

          # 3. Generate SHA-256 checksums
          (
            cd release-assets
            sha256sum "dsh-multi-device-v${version}.tgz" > "dsh-multi-device-v${version}.tgz.sha256"
            sha256sum "dsh-multi-device-bundle-v${version}.tar.gz" > "dsh-multi-device-bundle-v${version}.tar.gz.sha256"
          )
          ls -lh release-assets

      - name: Install official qualification runtime and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/qualification" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.18.0
      - name: Qualify the exact release tarball before publishing
        shell: bash
        env:
          DSH_SMOKE_ROOT: ${{ runner.temp }}/release-install-smoke
          DSH_SMOKE_CLI: ${{ runner.temp }}/qualification/node_modules/@deepseek-ai/dsh/lib/bin.js
          COREPACK_ENABLE_PROJECT_SPEC: '0'
          pnpm_config_pm_on_fail: ignore
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/qualification/node_modules/.bin:$PATH"
          export DSH_SMOKE_PACKAGE="$PWD/release-assets/dsh-multi-device-v$(tr -d '[:space:]' < VERSION).tgz"
          node scripts/smoke-official-install.mjs

      - name: Attest provenance for the qualified release assets
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: release-assets/*

      - name: Generate release notes and metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$DSH_RELEASE_CHANNEL" == "stable" ]]; then
            echo "name=DSH Multi-Device Plugin v${version}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            channel_label="正式版 (Stable)"
          else
            echo "name=DSH Multi-Device Plugin v${version} (测试版)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            channel_label="测试版 (Prerelease)"
          fi

          cat <<EOF > release-notes.md
          ## DSH Multi-Device Plugin ${GITHUB_REF_NAME} · ${channel_label}

          面向拥有多台开发机、通过一个 **DSH Desktop / Web** 统一管理所有设备的插件。

          ### 核心能力
          - **多设备连接**：以 SSH 隧道连接远端，复用系统 \`~/.ssh/config\` 与本机私钥列表，自动鉴权与断线指数退避重连。
          - **顶部设备标签页**：本机标签页保持原生本地 DSH，每台远端设备在自己的标签页里运行完整 DSH Web 页面（模型、审批、终端、文件上传等全部远端能力）。
          - **Keep-Alive 保活**：切换标签页不卸载远端页面，WebSocket、会话与草稿保持不变；每个标签页显示该设备的需回复/运行中/未读计数。
          - **设备独立与跨版本兼容**：远端零插件要求，兼容 DSH 0.2.x；DSH 0.1.x 仅支持冷读/轮询。

          ### 快速安装
          推荐在 DSH 官方「插件」管理页安装下方固定版本 URL，不需要源码或构建工具。
          Desktop 命令行必须使用 Desktop 提供的 dsh（先打开一次以初始化，再完全退出），npm 安装的 dsh 不能管理 desktop profile。
          \`\`\`bash
          # Desktop 提供的 dsh；不是 npm CLI
          dsh plugin --profile desktop add https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dsh-multi-device-v${version}.tgz

          # 或安装至 DSH Web profile
          dsh plugin --profile web add https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dsh-multi-device-v${version}.tgz
          \`\`\`

          ### 构建溯源与渠道
          - 精确源码提交：\`${GITHUB_SHA}\`
          - 验证与打包运行：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 构建 provenance：https://github.com/${GITHUB_REPOSITORY}/attestations
          - 当前渠道：**${channel_label}**；只有显式 stable 渠道会设为 latest，tag 推送默认为 test prerelease。
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          overwrite_files: true
          files: release-assets/*
